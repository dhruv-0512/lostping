[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lostping"
version = "0.1.0"
description = "AIS vessel anomaly detection — find ships behaving suspiciously"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "folium>=0.15",
    "pyarrow>=14.0",      # parquet support for pandas
    "zstandard>=0.21",    # .csv.zst decompression
]

[project.scripts]
lostping = "lostping.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lostping*"]